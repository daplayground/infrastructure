#cloud-config
write_files:
  - path: /home/ec2-user/cloud-init-script.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
      PRIVATE_IP=$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)
      systemctl enable --now containerd kubelet
      kubeadm init --apiserver-cert-extra-sans $PRIVATE_IP,$PUBLIC_IP

      # Update kube-apiserver.yaml to set bind-address
      sed -i '/--advertise-address/a\    - --bind-address=0.0.0.0' /etc/kubernetes/manifests/kube-apiserver.yaml

      # Wait for the API server to be ready
      until kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes; do sleep 1; done

      # Apply Calico manifest
      kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f https://raw.githubusercontent.com/projectcalico/calico/master/manifests/calico.yaml >> /home/ec2-user/cloud-init.log

      # Set up kubeconfig for the ec2-user
      mkdir -p /home/ec2-user/.kube
      cp -i /etc/kubernetes/admin.conf /home/ec2-user/.kube/config
      chown ec2-user:ec2-user /home/ec2-user/.kube/config

# cloud-config
runcmd:
  - /bin/bash -x /home/ec2-user/cloud-init-script.sh > happened
  - echo $(cat /proc/cmdline) > /home/ec2-user/cmdline.txt
  - kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f https://raw.githubusercontent.com/projectcalico/calico/master/manifests/calico.yaml
  - kubectl --kubeconfig /etc/kubernetes/admin.conf taint nodes --all node-role.kubernetes.io/master-
